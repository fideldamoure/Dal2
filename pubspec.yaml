name: baladiya_check
description: مسح القرارات الإدارية الورقية وتقييم مطابقتها لتشريع الوظيفة العمومية الجزائرية.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  image_picker: ^1.1.2
  flutter_tesseract_ocr: ^0.4.27
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/seed.json
    - assets/rules/rules.json
    - assets/tessdata/
    - assets/tessdata_config.json
